<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيارتي · Siyarati</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#14211b;--mute:#5d6b64;--g:#0f6b46;--gd:#0a4b32;--y:#f2b705;--line:#dbe3de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#17211c;--ink:#e8f0eb;--mute:#9aaba2;--g:#2fa874;--gd:#1f7a53;--line:#27352e}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;line-height:1.6}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
header{background:var(--gd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{font-weight:800;font-size:20px;flex:1}
.logo b{color:var(--y)}
.lang{display:flex;border:1px solid #ffffff66;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:4px 12px;cursor:pointer}
.lang button.on{background:#fff;color:var(--gd);font-weight:600}
.btn{background:var(--y);color:#14211b;border:0;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--g);color:#fff}
.hero{background:var(--g);color:#fff;padding:26px 0 70px}
.hero h1{margin:0 0 4px;font-size:28px;line-height:1.3;font-weight:800}
.hero p{margin:0;opacity:.9}
.filters{background:var(--card);border-radius:12px;padding:14px;margin-top:-50px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;border:1px solid var(--line)}
.seg{grid-column:1/-1;display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:none;border-radius:8px;padding:6px;cursor:pointer}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
select,input[type=text],input[type=tel],input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.top h2{margin:0;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding-bottom:30px}
.car{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.pic{height:110px;display:grid;place-items:center;font-size:54px;position:relative}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:#fff;color:var(--gd);font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px}
.car .in{padding:10px 12px}
.car h3{margin:0;font-size:16px}
.meta{color:var(--mute);font-size:13px}
.price{display:inline-block;margin-top:6px;background:var(--y);color:#14211b;font-weight:800;padding:1px 10px;border-radius:5px;border:2px solid #14211b}
.ad{background:repeating-linear-gradient(135deg,var(--card),var(--card) 12px,var(--bg) 12px,var(--bg) 24px);border:2px dashed var(--y);border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:170px}
.ad small{color:var(--mute)}
.ad.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:space-between;margin-top:14px}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov.show{display:flex}
.box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.box h3{margin:0 0 10px}
.box label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
.row{display:flex;gap:8px;margin-top:14px}.row .btn{flex:1}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.code{font-size:30px;font-weight:800;letter-spacing:6px;text-align:center;background:var(--bg);border-radius:10px;padding:8px;margin:10px 0}.btn.wa{display:block;text-align:center;text-decoration:none;background:#25d366;color:#08210f}.pt{font-size:13px;color:var(--mute);margin-inline-start:4px}.pts button{font-size:12px;line-height:1.3;padding:6px 2px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:10px 0;font-size:13px}.spec div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line)}.spec span{color:var(--mute)}.spec p{grid-column:1/-1;margin:4px 0}.spec .ops{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;border:0}.ops i{font-style:normal;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 8px}.chk{display:flex;flex-wrap:wrap;gap:4px 12px}.chk label{display:flex;align-items:center;gap:4px;margin:0;color:var(--ink)}.chk input{width:auto}textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:70px}.thumbs{display:flex;gap:6px;margin-top:6px}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px}
a.btn{text-decoration:none;display:inline-block}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:16px}
</style>
</head>

<div class="ov" id="ov"><div class="box" id="box"></div></div>

 if(c.cl)r.push([t('col'),COL.find(x=>x[0]===c.cl)[1+L]]);if(c.pp)r.push([t('pap'),t(c.pp==='c'?'pp1':'pp2')]);
 let h=r.map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
 if(c.op&&c.op.length)h+=`<div class="ops">${c.op.map(k=>'<i>'+t('o_'+k)+'</i>').join('')}</div>`;
 if(c.d)h+=`<p class="meta">${c.d}</p>`;return h}
function open_(html){$('#box').innerHTML=html;$('#ov').classList.add('show')}
function close_(){$('#ov').classList.remove('show')}
function loginForm(after){
 open_(`<h3>${t('lt')}</h3><label>${t('ph')}</label><input type="tel" id="ph" inputmode="numeric" maxlength="10" dir="ltr"><label>${t('pw')}</label><input type="password" id="pw"><div class="note" id="msg"></div><div class="row"><button class="btn alt" id="x">${t('cancel')}</button><button class="btn" id="go">${t('ok')}</button></div>`);
 $('#x').onclick=close_;
 $('#go').onclick=async()=>{const p=$('#ph').value.trim(),pw=$('#pw').value,m=$('#msg');
  if(!/^0[567]\d{8}$/.test(p)){m.textContent=t('badph');return}
  if(pw.length<6){m.textContent=t('badpw');return}
  const email=p+'@phone.siyarati.app';
  let r=await sb.auth.signInWithPassword({email,password:pw});
  if(r.error){r=await sb.auth.signUp({email,password:pw});
   if(r.error||!r.data.session){m.textContent=t('errlog');return}
   const q=await sb.from('profiles').insert({id:r.data.user.id,phone:p});if(q.error){m.textContent=t('errlog');return}}
  setUser(r.data.session);close_();render();if(after)after()};
}
function addForm(){
 const L=lang==='ar'?0:1;
 open_(`<h3>${t('at')}</h3><label>${t('mk')}</label><select id="ab"><option value="">${t('mksel')}</option>${Object.keys(M).map(b=>`<option>${b}</option>`).join('')}<option value="__o">${t('other')}</option></select><label>${t('md')}</label><select id="am" disabled></select><input type="text" id="ao" style="display:none;margin-top:6px"><label>${t('yr')}</label><select id="ay">${Array.from({length:30},(_,i)=>2026-i).map(y=>`<option>${y}</option>`).join('')}</select><label>${t('pc')}</label><input type="number" id="ap" inputmode="numeric" placeholder="200"><label>${t('pty')}</label><div class="seg pts" id="pts">${['f','n','o'].map((k,i)=>`<button type="button" data-p="${k}" class="${i?'':'on'}">${PI[k]}<br>${t('p'+k)}</button>`).join('')}</div><label>${t('st')}</label><select id="ac"><option value="new">${t('new')}</option><option value="used">${t('used')}</option></select><label>${t('gb')}</label><select id="ag"><option value="m">${t('gm')}</option><option value="a">${t('ga')}</option></select><label>${t('fu')}</label><select id="af">${Object.keys(FU).map(k=>`<option value="${k}">${t(FU[k])}</option>`).join('')}</select><label>${t('kmq')}</label><input type="number" id="ak" inputmode="numeric"><label>${t('col')}</label><select id="acl">${COL.map(x=>`<option value="${x[0]}">${x[1+L]}</option>`).join('')}</select><label>${t('pap')}</label><select id="app"><option value="c">${t('pp1')}</option><option value="p">${t('pp2')}</option></select><label>${t('opt')}</label><div class="chk">${OPT.map(k=>`<label><input type="checkbox" value="${k}"> ${t('o_'+k)}</label>`).join('')}</div><label>${t('wil')}</label><select id="aw">${Object.keys(W).map(k=>`<option value="${k}">${W[k][L]}</option>`).join('')}</select><label>${t('tel')}</label><input type="tel" id="at" inputmode="numeric" maxlength="10" dir="ltr" value="${user||''}"><div class="note" id="aterr"></div><label>${t('ds')}</label><textarea id="ad" maxlength="500"></textarea><label>${t('phs')}</label><input type="file" id="aph" accept="image/*" multiple><div class="thumbs" id="th"></div><div class="row"><button class="btn alt" id="x">${t('cancel')}</button><button class="btn" id="pub">${t('pub')}</button></div>`);
 $('#x').onclick=close_;
 document.querySelectorAll('#pts button').forEach(b=>b.onclick=()=>document.querySelectorAll('#pts button').forEach(x=>x.classList.toggle('on',x===b)));
 $('#ab').onchange=()=>{const v=$('#ab').value,m=$('#am'),o=$('#ao'),oth=v==='__o';m.style.display=oth?'none':'';o.style.display=oth?'':'none';m.disabled=!v||oth;m.innerHTML=(!v||oth)?'':`<option value="">${t('mdsel')}</option>`+M[v].map(x=>`<option>${x}</option>`).join('')+`<option value="__o">${t('other')}</option>`};
 $('#am').onchange=()=>{$('#ao').style.display=$('#am').value==='__o'?'':'none'};
 imgs=[];$('#aph').onchange=e=>{imgs=[];$('#th').innerHTML='';[...e.target.files].slice(0,4).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const u=cv.toDataURL('image/jpeg',.7);imgs.push(u);$('#th').insertAdjacentHTML('beforeend','<img src="'+u+'">')};im.src=r.result};r.readAsDataURL(f)})};
 $('#pub').onclick=async()=>{const ob=$('#ab').value==='__o',b=ob?$('#ao').value.trim():$('#ab').value,m=ob?'':($('#am').value==='__o'?$('#ao').value.trim():$('#am').value),p=+$('#ap').value,tp=$('#at').value.trim(),c=$('#ac').value;
  if(!b||(!m&&!ob)||!p)return;if(!/^0[567]\d{8}$/.test(tp)){$('#aterr').textContent=t('badph');return}
  const btn=$('#pub');btn.disabled=true;btn.textContent=t('saving');
  try{const urls=[];for(const u of imgs){const bl=await (await fetch(u)).blob(),path=uid+'/'+crypto.randomUUID()+'.jpg',up=await sb.storage.from('listing-images').upload(path,bl,{contentType:'image/jpeg'});if(up.error)throw up.error;urls.push(sb.storage.from('listing-images').getPublicUrl(path).data.publicUrl)}
  const q=await sb.from('listings').insert({user_id:uid,brand:esc(b),model:esc(m),year:+$('#ay').value,price_million:p,price_type:OUT[$('#pts .on').dataset.p],condition:c,gearbox:GBO[$('#ag').value],fuel:FUO[$('#af').value],km:c==='new'?0:(+$('#ak').value||0),color:$('#acl').value,papers:PPO[$('#app').value],options:[...document.querySelectorAll('.chk input:checked')].map(x=>x.value),wilaya:$('#aw').value,description:esc($('#ad').value.trim()),phone:tp,images:urls});
  if(q.error)throw q.error;close_();cond='all';await load()}catch(e){btn.disabled=false;btn.textContent=t('pub');$('#aterr').textContent=t('errpub')}};
}
function detail(i){const c=cars[i],L=lang==='ar'?0:1;
 open_(`<div class="pic" style="background:${c.img?`center/cover url(${c.img})`:c.col};border-radius:10px">${c.img?'':c.e}</div><div class="thumbs">${(c.imgs||[]).map(u=>`<img src="${u}">`).join('')}</div><h3 style="margin-top:10px">${c.b} ${c.m}</h3><div class="meta">${c.y} · ${fmt(c.km)} ${t('km')} · ${W[c.w][L]} · ${t(c.c)}</div><span class="price">${fmt(c.p)} ${t('da')}</span> <span class="pt">${PI[c.pt||'f']} ${t('p'+(c.pt||'f'))}</span><div class="spec">${spec(c)}</div><div class="row"><button class="btn alt" id="x">${t('close')}</button><button class="btn" id="cl">${t('call')}</button></div><div class="row"><button class="btn alt" id="rp">⚑ ${t('rep')}</button>${c.uid&&c.uid===uid?`<button class="btn alt" id="dl">${t('del')}</button>`:''}</div>`);
 $('#x').onclick=close_;$('#cl').onclick=()=>{location.href='tel:'+c.ph};
 $('#rp').onclick=()=>{if(!uid){close_();loginForm();return}open_(`<h3>${t('rep')}</h3><div class="row" style="flex-direction:column">${[1,2,3].map(k=>`<button class="btn alt" data-rs="${k}">${t('rep'+k)}</button>`).join('')}</div>`);document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{await sb.from('reports').insert({listing_id:c.id,reporter_id:uid,reason:b.textContent});open_(`<h3>${t('repdone')}</h3><div class="row"><button class="btn" id="x">${t('close')}</button></div>`);$('#x').onclick=close_})};
 if($('#dl'))$('#dl').onclick=async()=>{await sb.from('listings').delete().eq('id',c.id);close_();load()};
}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;try{localStorage.setItem('lang',lang)}catch(_){}render();return}
 const s=e.target.closest('[data-c]');if(s){cond=s.dataset.c;render();return}
 const c=e.target.closest('.car');if(c){detail(+c.dataset.i);return}
 if(e.target===$('#ov'))close_();
});
['#fBrand','#fW','#fP','#fG','#fF'].forEach(s=>$(s).addEventListener('change',render));
$('#loginBtn').onclick=()=>user?(sb.auth.signOut(),setUser(null),render()):loginForm();
$('#addBtn').onclick=()=>user?addForm():loginForm(addForm);
if(!lang){lang='ar';render();
 open_(`<h3 style="text-align:center">اختر لغتك · Choisissez votre langue</h3><div class="row" style="flex-direction:column"><button class="btn" data-l="ar" onclick="close_()">العربية</button><button class="btn alt" data-l="fr" onclick="close_()">Français</button></div>`);
}else render();
sb.auth.getSession().then(({data})=>{setUser(data.session);render()});
load();
</script>
